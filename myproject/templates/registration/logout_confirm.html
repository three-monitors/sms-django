{% extends "core/base.html" %}

{% block content %}
    <h1>Вихід із системи</h1>

    <p>Ви впевнені, що хочете вийти?</p>

    <form method="post"
          action="{% url 'logout' %}"
          style="display: inline;
                 margin: 0;
                 padding: 0">
        {% csrf_token %}
        <button type="submit"
                class="nav-link logout-btn"
                style="background: none;
                       border: none;
                       color: inherit;
                       cursor: pointer;
                       text-decoration: none;
                       font-size: inherit;
                       font-family: inherit;
                       padding: 0;
                       margin: 0">Вийти</button>
    </form>
{% endblock %}
