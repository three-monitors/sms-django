{% extends "core/base.html" %}

{% block content %}
    <h1>{{ title }}</h1>

    <form method="post" novalidate>
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="errorlist">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <div class="clear">
            <button type="submit" class="status-button">Зберегти</button>
            <a href="{% url 'orders_list' %}" class="status-button">Скасувати</a>
        </div>
    </form>
{% endblock %}
