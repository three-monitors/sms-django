{% extends "core/base.html" %}

{% block content %}
    <h1>{{ title }}</h1>

    <div class="warning">
        <p>Ви впевнені, що хочете видалити замовлення #{{ order.id }}?</p>
    </div>

    <div class="div-form">
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="status-button red">Так, видалити</button>
        </form>
        <a href="{% url 'order_detail' order.id %}" class="status-button">Скасувати</a>
    </div>
{% endblock %}
