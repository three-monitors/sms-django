<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background-color: #e59696; padding: 10px; margin-bottom: 20px; }
        nav a { color: white; margin: 0 10px; text-decoration: none; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Головна</a> |
        <a href="{% url 'clients_list' %}">Клієнти</a> |
        <a href="{% url 'services_list' %}">Послуги</a> |
        <a href="{% url 'orders_list' %}">Замовлення</a>
        <a href="{% url 'about' %}">Про проєкт</a>
    </nav>

    <h1>{{ title }}</h1>
    
    {% if clients %}
        <table border="1">
            <tr>
                <th>ID</th>
                <th>Ім'я</th>
                <th>Телефон</th>
                <th>Email</th>
                <th>Дія</th>
            </tr>
            {% for client in clients %}
            <tr>
                <td>{{ client.id }}</td>
                <td>{{ client.name }}</td>
                <td>{{ client.phone }}</td>
                <td>{{ client.email }}</td>
                <td><a href="{% url 'client_detail' client.id %}">Переглянути</a></td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>Немає клієнтів.</p>
    {% endif %}
</body>
</html>
